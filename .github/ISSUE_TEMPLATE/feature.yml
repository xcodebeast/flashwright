name: Speedup or feature idea
description: A place where Flashwright could save time, or something it should do.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Where does your suite spend time, and how did you measure it? Numbers from `npx playwright test --reporter=list` or a trace help a lot.
    validations:
      required: true
