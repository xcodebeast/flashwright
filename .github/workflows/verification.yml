name: Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-24.04, macos-14]
        runtime: [bun, node-22, node-24]
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 30
    env:
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 tools/bootstrap.py >> "$GITHUB_PATH"
      - if: matrix.runtime != 'bun'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.runtime == 'node-22' && '22.22.0' || '24.15.0' }}
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: python3 -m unittest discover -s tools -p 'test_*.py'
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - run: bun node_modules/playwright/cli.js install --with-deps chromium
      - run: python3 tools/watchdog.py --timeout 60 -- ${{ matrix.runtime == 'bun' && 'bun' || 'node' }} tools/run-runner-boundary.mjs
      - run: ${{ matrix.runtime == 'bun' && 'bun' || 'node' }} tools/verify-core.mjs
        env:
          FLASHWRIGHT_ENVIRONMENT_CLASS: native-ci
      - run: python3 tools/watchdog.py --timeout 900 --report-directory compatibility/evidence/resources -- ${{ matrix.runtime == 'bun' && 'bun' || 'node' }} tools/test-package-managers.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: contracts-${{ matrix.operating-system }}-${{ matrix.runtime }}
          path: compatibility/evidence

  native-baseline:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        operating-system: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.operating-system }}
    timeout-minutes: 20
    env:
      PLAYWRIGHT_SKIP_BROWSER_GC: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 tools/bootstrap.py >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun node_modules/playwright/cli.js install --with-deps chromium
      - run: bun run baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: baseline-${{ matrix.operating-system }}
          path: benchmarks/results
