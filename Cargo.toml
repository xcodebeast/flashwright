[workspace]
members = ["crates/flashwright-protocol", "crates/flashwright-browser", "crates/flashwright-engine", "crates/flashwright-driver"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
thiserror = "=2.0.17"
tokio = { version = "=1.48.0", features = ["io-util", "io-std", "net", "process", "signal", "macros", "rt-multi-thread", "sync", "time", "test-util"] }
command-fds = "=0.3.2"
nix = { version = "=0.30.1", features = ["signal", "process", "fs"] }
tempfile = "=3.23.0"
flashwright-protocol = { path = "crates/flashwright-protocol" }
flashwright-browser = { path = "crates/flashwright-browser" }
flashwright-engine = { path = "crates/flashwright-engine" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
hyper = { path = "vendor/hyper" }
hyper-util = { path = "vendor/hyper-util" }
